name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly: Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Pinned to 24.04: setup-python has no 3.9 build for ubuntu-26.04.
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install test dependencies
        run: python -m pip install 'coverage>=7.0,<8'

      - name: Syntax check
        run: >
          python -c "import glob, py_compile;
          [py_compile.compile(f, doraise=True)
          for f in glob.glob('**/*.py', recursive=True)
          if 'site-packages' not in f and '__pycache__' not in f
          and '.skills' not in f and '.code-review-cache' not in f]"

      - name: Check generated docs are current
        run: python tools/generate.py --check

      - name: Run eval harness
        run: python -m ccr eval

      - name: SKILL.md compliance suite
        run: python tests/compliance_test.py

      - name: Review-skill compliance suite
        run: python tests/review_compliance_test.py

      - name: Run all unittest suites under coverage
        run: python -m coverage run -m unittest discover -s tests -p "test_*.py" -v

      - name: Coverage report
        run: python -m coverage report

      - name: Per-file coverage floor
        run: |
          python -m coverage json -o coverage.json
          python tools/coverage_floor.py coverage.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-${{ matrix.os }}-${{ matrix.python-version }}
          path: .coverage
          retention-days: 7

      - name: Run Bash test suite
        if: runner.os != 'Windows'
        run: ./test.sh
        shell: bash

      - name: Run Windows PowerShell test suite
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File tests/Test-Windows.ps1
        shell: powershell
