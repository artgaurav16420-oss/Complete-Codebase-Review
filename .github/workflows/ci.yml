name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly: Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Pinned to 24.04: setup-python has no 3.9 build for ubuntu-26.04.
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        exclude:
          # macOS runners are the scarce resource: seven jobs per run overflow
          # the concurrent macOS cap, and GitHub cancels the overflow while it
          # is still queued (zero steps executed, ~15 min in), which fails the
          # run. Keep the floor (3.9) and the ceiling (3.15) there; Linux and
          # Windows still cover every interpreter.
          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Linux' && '~/.cache/pip' || (runner.os == 'macOS' && '~/Library/Caches/pip' || '~/AppData/Local/pip/Cache') }}
          # No dependency manifest to hash: the only package installed is the
          # coverage range below, so the key tracks that range directly.
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-coverage7
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install test dependencies
        run: python -m pip install 'coverage>=7.0,<8'

      - name: Syntax check
        run: >
          python -c "import glob, py_compile;
          [py_compile.compile(f, doraise=True)
          for f in glob.glob('**/*.py', recursive=True)
          if 'site-packages' not in f and '__pycache__' not in f
          and '.skills' not in f and '.code-review-cache' not in f]"

      - name: Check generated docs are current
        run: python tools/generate.py --check

      - name: Run eval harness
        run: python -m ccr eval

      - name: SKILL.md compliance suite
        run: python tests/compliance_test.py

      - name: Review-skill compliance suite
        run: python tests/review_compliance_test.py

      - name: Run all unittest suites under coverage
        run: python -m coverage run -m unittest discover -s tests -p "test_*.py" -v

      - name: Coverage report
        run: python -m coverage report

      - name: Per-file coverage floor
        run: |
          python -m coverage json -o coverage.json
          python tools/coverage_floor.py coverage.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-${{ matrix.os }}-${{ matrix.python-version }}
          path: .coverage
          retention-days: 7

      - name: Run Bash test suite
        if: runner.os != 'Windows'
        run: bash test.sh --skill-checks-only
        shell: bash

      - name: Run Windows PowerShell test suite
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File tests/Test-Windows.ps1
        shell: powershell

  commit-hygiene:
    # An empty commit reports work that does not exist and cannot be reverted
    # (F-083/F-084). Commit scope is a human decision; the empty tree is the
    # part a machine can prove, so only that is gated here.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reject empty commits
        run: |
          status=0
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # A failed command substitution in a for-list is not a failure under
          # bash -e, so an unresolvable ref would leave the loop empty and the
          # job green. Prove both commits are present first.
          git rev-parse --verify "$base^{commit}" >/dev/null
          git rev-parse --verify "$head^{commit}" >/dev/null
          for commit in $(git rev-list --no-merges "$base..$head"); do
            if ! parent="$(git rev-parse --verify -q "$commit^")"; then
              # A root commit, or a shallow boundary: no parent to compare.
              continue
            fi
            if [ "$(git rev-parse "$commit^{tree}")" = \
                 "$(git rev-parse "$parent^{tree}")" ]; then
              echo "::error::$commit is an empty commit (tree identical to $parent); drop it"
              status=1
            fi
          done
          exit $status

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install build tooling
        # Exact pin shared with release.yml so CI validates the artifact the
        # release workflow actually ships.
        run: python -m pip install 'build==1.3.0'

      - name: Build sdist and wheel
        run: python -m build

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Smoke-test installed console script
        run: |
          output="$(ccr --version)"
          test -n "$output" || { echo "ERROR: ccr --version printed nothing"; exit 1; }
          expected="ccr $(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          if [ "$output" != "$expected" ]; then
            echo "ERROR: ccr --version printed '$output', expected '$expected'"
            exit 1
          fi
          echo "[SUCCESS] ccr --version matches pyproject.toml: $output"
