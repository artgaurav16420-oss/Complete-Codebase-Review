name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install 'coverage>=7.0,<8'

      - name: Generate drift check
        run: python tools/generate.py --check

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Docs and compliance suite
        run: |
          python tests/compliance_test.py
          python tests/review_compliance_test.py

      - name: Eval harness
        run: python -m ccr eval

      - name: Coverage gate
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py"
          python -m coverage report

      - name: Per-file coverage floor
        run: |
          python -m coverage json -o coverage.json
          python tools/coverage_floor.py coverage.json

      - name: Bash contract checks
        run: bash test.sh --skill-checks-only

  windows-test:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Windows PowerShell test suite
        run: powershell -ExecutionPolicy Bypass -File tests/Test-Windows.ps1
        shell: powershell

  matrix-test:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the declared floor: `match`, `X | Y` unions and `dict | dict`
          # parse on newer hosts but raise SyntaxError here.
          - os: ubuntu-24.04
            python-version: '3.9'
          # 3.11 is the interpreter the release is built and published from.
          - os: ubuntu-24.04
            python-version: '3.11'
          # 3.13 is the newest stable series.
          - os: ubuntu-24.04
            python-version: '3.13'
          # 3.15 is the declared ceiling: removed stdlib APIs surface here.
          - os: ubuntu-24.04
            python-version: '3.15'
          # Windows at the floor covers path/encoding assumptions that the
          # Linux floor leg cannot see.
          - os: windows-latest
            python-version: '3.9'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check every module
        run: >
          python -c "import glob, py_compile;
          [py_compile.compile(f, doraise=True)
          for f in glob.glob('**/*.py', recursive=True)
          if 'site-packages' not in f and '__pycache__' not in f
          and '.skills' not in f and '.code-review-cache' not in f]"

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Eval harness
        run: python -m ccr eval

  build:
    needs: [test, windows-test, matrix-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify tag matches pyproject.toml version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = data["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = "v" + version
          if tag != expected:
              raise SystemExit(
                  "Tag %s does not match pyproject.toml version %s (expected %s)"
                  % (tag, version, expected)
              )
          print("Tag %s matches pyproject.toml version %s" % (tag, version))
          PY

      - name: Install build tooling
        run: python -m pip install 'build==1.3.0'

      - name: Build sdist and wheel
        run: python -m build

      - name: Write checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading assets"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          fi
