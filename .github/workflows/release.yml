name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install 'coverage>=7.0,<8'

      - name: Generate drift check
        run: python tools/generate.py --check

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Docs and compliance suite
        run: |
          python tests/compliance_test.py
          python tests/review_compliance_test.py

      - name: Eval harness
        run: python -m ccr eval

      - name: Coverage gate
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py"
          python -m coverage report

      - name: Per-file coverage floor
        run: |
          python -m coverage json -o coverage.json
          python tools/coverage_floor.py coverage.json

      - name: Bash contract checks
        run: bash test.sh --skill-checks-only

  windows-test:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Windows PowerShell test suite
        run: powershell -ExecutionPolicy Bypass -File tests/Test-Windows.ps1
        shell: powershell

  build:
    needs: [test, windows-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: python -m pip install 'build>=1,<2'

      - name: Build sdist and wheel
        run: python -m build

      - name: Write checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
