name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install 'coverage>=7.0,<8'

      - name: Generate drift check
        run: python tools/generate.py --check

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Docs and compliance suite
        run: |
          python tests/compliance_test.py
          python tests/review_compliance_test.py

      - name: Eval harness
        run: python -m ccr eval

      - name: Coverage gate
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py"
          python -m coverage report

      - name: Per-file coverage floor
        run: |
          python -m coverage json -o coverage.json
          python tools/coverage_floor.py coverage.json

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: python -m pip install 'build>=1,<2'

      - name: Build sdist and wheel
        run: python -m build

      - name: Write checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
